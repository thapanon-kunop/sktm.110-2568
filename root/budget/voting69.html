<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เปลี่ยนเส้นทาง - voting69</title>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- CSS -->
    <link rel="stylesheet" href="/assets/css/fonts.css">
</head>
<body class="bg-dark text-white m-5">
    <h1 class="text-center">เปลี่ยนเส้นทาง</h1>
    <p class="text-center">
        ไปยัง <span class="btn-link">https://sktm210-2569.vercel.app/budget/voting69/</span><br>
        <button class="mt-3 btn btn-warning fw-bold d-inline-block px-5 prompt" id="button">ไปตอนนี้ (<span id="wait" class="prompt"></span>)</button>
    </p>
    <!-- Script -->
    <script>
        const btn = document.querySelector("#button");
        const wait_span = document.querySelector("#wait");

        function wait(time_sec){
            const time = time_sec * 1000;
            return new Promise((resolve, reject) => {
                setTimeout(
                    () => resolve(),
                    time
                );
            });
        }

        async function start() {
            for (let count = 10; count >= 1; count--) {
                wait_span.innerText = count;
                await wait(1);
            }
            wait_span.innerText = 0;
            go()
        }

        function go() {
            window.location.href = "voting69";
        }

        btn.addEventListener("click", go);
        start();
    </script>
</body>
</html>
